[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = true
  quiet = false
  logfile = ""
  hostname = "telegraf"
  omit_hostname = false

# Input Plugin: Read from Kafka 'anomalies' topic
[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  topics = ["anomalies"]
  max_message_len = 1000000
  data_format = "json"
  name_override = "transactions"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05.999999"
  tag_keys = ["location", "prediction", "transaction_id"]
  consumer_group = "telegraf_metrics_consumers_v2"
  offset = "oldest"

# Output Plugin: Write to InfluxDB
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "anomaly_detection"
  skip_database_creation = false
